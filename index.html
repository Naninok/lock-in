<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>เข้าสู่ระบบ</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #f7bcbc, #f7bcbc);
      font-family: Arial, sans-serif;
      color: #333;
    }

    .glass-box {
      background: rgba(255, 255, 255, 0.35); 
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 30px 20px;
      width: 300px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .glass-box img {
      width: 110px;
      margin-bottom: 25px;
    }

    .glass-box h2 {
      margin: 0 0 20px 0;
      font-size: 22px;
      font-weight: 600;
      color: #cc0000; /* Veolia red */
    }

    /* สไตล์สำหรับ input fields ทั้งหมด */
    .glass-box input[type="text"],
    .glass-box input[type="password"] {
      /* เพิ่ม box-sizing: border-box; ตรงนี้ครับ */
      box-sizing: border-box; 
      width: 100%; /* เปลี่ยนเป็น 100% เพื่อให้เต็มความกว้างของกล่องแม่ */
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.6);
      color: #222;
      text-align: center;
    }

    .glass-box button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #cc0000; /* Veolia red */
      color: white;
      font-weight: bold;
      transition: 0.2s;
    }

    .glass-box button:hover {
      background: #e60000;
    }
  </style>
</head>

<body>

  <div class="glass-box">
    <!-- โลโก้ Veolia -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/48/Veolia_logo.svg/1024px-Veolia_logo.svg.png" alt="Veolia Logo" />

    <h2>เข้าสู่ระบบ</h2>

    <!-- เพิ่มช่องใส่ชื่อผู้ใช้ -->
    <input type="text" id="username" placeholder="ชื่อผู้ใช้">
    
    <!-- ช่องใส่รหัสผ่าน -->
    <input type="password" id="password" placeholder="รหัสผ่าน">
    
    <button onclick="checkLogin()">เข้าสู่ระบบ</button>
  </div>

  <script>
    function checkLogin() {
      // กำหนดชื่อผู้ใช้และรหัสผ่านที่ถูกต้อง
      const correctUsername = "admin"; // ← ชื่อผู้ใช้ที่ต้องการ
      const correctPassword = "7890";  // ← รหัสผ่านที่ต้องการ

      // รับค่าจาก input fields
      const inputUsername = document.getElementById("username").value;
      const inputPassword = document.getElementById("password").value;

      // ตรวจสอบทั้งชื่อผู้ใช้และรหัสผ่าน
      if (inputUsername === correctUsername && inputPassword === correctPassword) {
        window.location.href = "https://naninok.github.io//"; // เปลี่ยน URL ปลายทางตามต้องการ
      } else {
        alert("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");
      }
    }
  </script>

</body>
</html>
