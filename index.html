<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>เข้าสู่ระบบ</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #f7bcbc, #f7bcbc);
      font-family: Arial, sans-serif;
      color: #333;
    }

    .glass-box {
      background: rgba(255, 255, 255, 0.35); 
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      padding: 30px 20px;
      width: 300px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .glass-box img {
      width: 110px;
      margin-bottom: 25px;
    }

    .glass-box h2 {
      margin: 0 0 20px 0;
      font-size: 22px;
      font-weight: 600;
      color: #cc0000;
    }

    .glass-box input {
      box-sizing: border-box; 
      width: 100%; 
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.6);
      color: #222;
      text-align: center;
    }

    .glass-box button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #cc0000;
      color: white;
      font-weight: bold;
      transition: 0.2s;
    }

    .glass-box button:hover {
      background: #e60000;
    }
  </style>
</head>

<body>

  <div class="glass-box">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/48/Veolia_logo.svg/1024px-Veolia_logo.svg.png">

    <h2>เข้าสู่ระบบ</h2>

    <input type="text" id="username" placeholder="ชื่อผู้ใช้">
    <input type="password" id="password" placeholder="รหัสผ่าน">
    
    <button id="loginButton">เข้าสู่ระบบ</button>
  </div>

  <script>

    /* -----------------------
       🔒 Base64 config
       ------------------------ */

    const b64_username_hash = "NGFiZDE5MGUwNjA1ZTcxZTJmNzljOGM3OTkzN2E3MDMwNWI4MDc1OTNiOTc5ZGQwNTY4ZjRhYjQ0NGVhMDYzOQ==";
    const b64_password_hash = "OWFmMTViMzM2ZTZhOTYxOTkyODUzN2RmMzBiMmU2YTIzNzY1NjlmY2Y5ZDdlNzczZWNjZWRlNjU2MDY1MjlhMA==";
    const b64_redirect_url  = "aHR0cHM6Ly9uYW5pbm9rLmdpdGh1Yi5pby9TQ0ctS1cv";

    function b64(s) { return atob(s); }

    /* -----------------------
       SHA-256 function
    ------------------------ */
    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    /* -----------------------
       Login check
    ------------------------ */
    async function checkLogin() {

      const correctUsernameHash = b64(b64_username_hash);
      const correctPasswordHash = b64(b64_password_hash);
      const redirectURL = b64(b64_redirect_url);

      const inputUsername = document.getElementById("username").value.trim();
      const inputPassword = document.getElementById("password").value;

      const inputUsernameHash = await sha256(inputUsername);
      const inputPasswordHash = await sha256(inputPassword);

      if (inputUsernameHash === correctUsernameHash &&
          inputPasswordHash === correctPasswordHash) {

        window.location.href = redirectURL;

      } else {
        alert("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");
      }
    }

    // Click login
    document.getElementById("loginButton").addEventListener("click", checkLogin);

    // Enter key triggers login
    document.getElementById("username").addEventListener("keyup", e => {
      if (e.key === "Enter") checkLogin();
    });

    document.getElementById("password").addEventListener("keyup", e => {
      if (e.key === "Enter") checkLogin();
    });

  </script>

</body>
</html>
